# Frozen recipe for prospective experiments, not a replay of adaptive seed-42 tuning.
algorithm: predictive-mappo
agent:
  defender_num: 3
  boid_state: true
  form_reward: true
environment:
  protocol: paper-parameters-v1
  total_time: 60.0
  agility_noise_half_width: 0.5
training:
  episodes_per_update: 1024
  agility: 2.0
  noisy_agility: true
mappo:
  hidden_dim: 512
  relation_dim: 64
  coordination_dim: 16
  actor_lr: 0.000001
  critic_lr: 0.0003
  ppo_epochs: 12
  minibatch_size: 4096
  clip_ratio: 0.1
  entropy_coef: 0.0001
  max_grad_norm: 0.5
  reward_gamma: 1.0
  cost_gamma: 1.0
  gae_lambda: 0.95
  cost_gae_lambda: 1.0
  collision_budget: 0.05
  lagrange_init: 50.0
  lagrange_lr: 100.0
  baseline_initialization: true
  reward_value_scale: 100.0
  target_kl: 0.01
  prediction_lr: 0.001
  prediction_eps: 0.00000001
  joint_ratio: true
  cost_monte_carlo_targets: true
  theta_space_gate: true
  full_batch_guard: true
  full_batch_backtracking_steps: 8
  compatibility_prior: true
  compatibility_gain: 1.0
  compatibility_margin: 7.0
  compatibility_temperature: 1.0
  compatibility_neighbor_temperature: 2.0
  compatibility_compact_risk: true
  compatibility_task_priority: true
  compatibility_priority_temperature: 5.0
  compatibility_mixture_points: 9
  compatibility_peer_intent: true
  compatibility_joint_mixture: true
  compatibility_context_gain: true
  context_gain_only: false
  censored_gate_likelihood: true
  breach_constraint: true
  breach_budget: 0.0025
  breach_lagrange_init: 5.0
  event_lagrange_lr: 100.0
prediction:
  horizon: 2.0
  dt: 0.05
  distance_scale: 5.0
  speed_scale: 5.0
  mixture_points: 9
