# Short checkpoint handoff and training integration check.
# RL
rl:
  hidden_dim: 512
  batch_size: 4096
  learning_rate: 0.0001
  GAMMA: 0.99
  TAU: 0.005

# Training
training:
  warm_steps: 128
  total_steps: 512
  eval_interval: 512
  eval_episodes: 5

# Agent
agent:
  round_num: 1
  learning_side: 'Def'
  defender_num: 3
  load_critic: False


